<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>キャラクター詳細：操作ボタン配置案</title>
  <style>
    :root {
      --page: #0d1729;
      --panel: #1d2b40;
      --text: #eef4ff;
      --muted: #aebbd0;
      --move: #77879d;
      --output: #10a7a0;
      --recreate: #7a62dc;
      --edit: #367eea;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .page { max-width: 900px; margin: 0 auto; padding: 24px 16px; }
    .note { color: var(--muted); line-height: 1.6; margin: 0 0 20px; }
    .character-card { padding: 18px; border-radius: 12px; background: var(--panel); }
    .character-title { margin: 0 0 18px; font-size: 1.35rem; }

    /* Desktop: actions are separated into a left and a right group. */
    .character-actions {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
    }
    .action-group { display: flex; gap: 8px; }

    .action-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.42rem;
      min-height: 38px;
      padding: 0.45rem 0.8rem;
      border: 1px solid transparent;
      border-radius: 7px;
      color: var(--text);
      background: transparent;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }
    .action-button:hover { filter: brightness(1.15); }

    /* Moving between screens */
    .action-button--move { border-color: var(--move); color: #d6dfec; }
    /* Copying/exporting data */
    .action-button--output { border-color: var(--output); color: #59d8d2; }
    /* Creating a new version */
    .action-button--recreate { border-color: var(--recreate); color: #c6baff; }
    /* Editing the current character */
    .action-button--edit { border-color: var(--edit); color: #8ab8ff; }

    .legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 18px; color: var(--muted); font-size: .84rem; }
    .legend span::before { content: "●"; margin-right: 6px; }
    .legend .move::before { color: var(--move); }
    .legend .output::before { color: var(--output); }
    .legend .recreate::before { color: var(--recreate); }
    .legend .edit::before { color: var(--edit); }

    /* Mobile: retain the left/right meaning in a clear two-column grid. */
    @media (max-width: 575.98px) {
      .page { padding: 16px 12px; }
      .character-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .action-group { display: contents; }
      .action-button { width: 100%; min-width: 0; padding: .42rem .3rem; font-size: .86rem; }
      .action-group--left .action-button { grid-column: 1; }
      .action-group--right .action-button { grid-column: 2; }
      .action-button--move, .action-button--recreate { grid-row: 1; }
      .action-button--output, .action-button--edit { grid-row: 2; }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>操作ボタン配置案</h1>
    <p class="note"><strong>実装済み（2026-07-26）:</strong> この配置をキャラクター詳細画面へ反映しました。</p>
    <p class="note">左列は画面移動・出力、右列はキャラクターの変更操作です。スマホでは列の意味を保ったまま、2列×2行にします。</p>

    <section class="character-card" aria-label="キャラクター操作の見本">
      <h2 class="character-title">👤 神代 栞</h2>
      <nav class="character-actions" aria-label="キャラクター操作">
        <div class="action-group action-group--left">
          <a class="action-button action-button--move" href="#">← 戻る</a>
          <button class="action-button action-button--output" type="button">⇩ 出力</button>
        </div>
        <div class="action-group action-group--right">
          <button class="action-button action-button--recreate" type="button">⑂ 再作成</button>
          <a class="action-button action-button--edit" href="#">✎ 編集</a>
        </div>
      </nav>
      <div class="legend" aria-label="色の意味">
        <span class="move">移動</span>
        <span class="output">出力・コピー</span>
        <span class="recreate">再作成</span>
        <span class="edit">編集</span>
      </div>
    </section>
  </main>
</body>
</html>
